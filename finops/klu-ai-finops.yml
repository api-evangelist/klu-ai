meters:
- name: seats
  description: Billable platform seats on the Team tier, charged per seat per month.
  unit: seats
  aggregation: sum
  dimensions:
  - workspace
  - plan
- name: action_runs
  description: Action generations executed via the Klu Engine; track to attribute upstream token cost.
  unit: requests
  aggregation: sum
  dimensions:
  - workspace
  - app
  - action
- name: upstream_input_tokens
  description: Input tokens billed by the connected upstream LLM provider for generations.
  unit: tokens
  aggregation: sum
  dimensions:
  - workspace
  - model
  - provider
- name: upstream_output_tokens
  description: Output tokens billed by the connected upstream LLM provider for generations.
  unit: tokens
  aggregation: sum
  dimensions:
  - workspace
  - model
  - provider
- name: context_documents
  description: Documents and files ingested into Context libraries for retrieval-augmented generation.
  unit: documents
  aggregation: sum
  dimensions:
  - workspace
  - context
principles:
- name: Visibility
  description: Separate Klu seat spend from upstream LLM provider token spend; attribute Action runs to apps and teams.
- name: Allocation
  description: Tag Actions and API keys per app/team and map to internal cost centers; reconcile upstream provider invoices.
- name: Optimization
  description: Enable response caching, pick smaller models in Action model config, and use experiments/evals to select the cheapest model that passes quality bars.
- name: Accountability
  description: Assign owners per app and review combined seat plus upstream token spend monthly against budget.
maintainers:
