description: >-
  FinOps view of Klu spend. Klu bills a seat-based SaaS subscription (Starter free,
  Team per-seat, Enterprise custom) for the platform, while the variable cost of
  generations flows through the upstream LLM providers (OpenAI, Anthropic, and
  others) whose API keys are connected to a workspace. Cost optimization therefore
  spans two layers - Klu seats and upstream model token spend - with caching,
  smaller models, and evaluation-driven model selection as the main levers.
notes: >-
  reconciled false - seat pricing is taken from the public marketing site and the
  upstream token costs depend on the connected providers, not Klu. Verify figures
  and platform availability before relying on them; the product appears dormant
  (see review.yml).
